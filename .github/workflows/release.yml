name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TSLP_OFFLINE: "1"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Validate release version
        shell: bash
        run: node scripts/release.mjs check "${GITHUB_REF_NAME#v}"
      - name: Build native binary
        run: cargo +1.97.1 build --locked --release --target ${{ matrix.target }}
      - name: Test and package binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/astcount"
          "$binary" --version
          node scripts/release.mjs stage "${{ matrix.platform }}" "$binary"
          version="${GITHUB_REF_NAME#v}"

          package_dir="$RUNNER_TEMP/npm-packages"
          install_dir="$RUNNER_TEMP/npm-install"
          npm_cache="$RUNNER_TEMP/npm-cache"
          mkdir -p "$package_dir"
          npm pack "./npm/platforms/${{ matrix.platform }}" \
            --pack-destination "$package_dir" --silent --cache "$npm_cache"
          npm pack ./npm/astcount \
            --pack-destination "$package_dir" --silent --cache "$npm_cache"
          npm install --prefix "$install_dir" --offline --ignore-scripts --no-audit \
            --cache "$npm_cache" \
            "$package_dir/astcount-${{ matrix.platform }}-${version}.tgz" \
            "$package_dir/astcount-${version}.tgz"
          test "$("$install_dir/node_modules/.bin/astcount" --version)" = \
            "astcount ${version}"

          archive="astcount-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p artifact bundle
          cp "$binary" bundle/astcount
          cp LICENSE README.md bundle/
          tar -C bundle -czf "artifact/$archive" .
          (cd artifact && shasum -a 256 "$archive" > "$archive.sha256")
          cp "$binary" artifact/astcount
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: artifact
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=(artifacts/binary-*/*.tar.gz artifacts/binary-*/*.sha256)
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --draft
          fi

          for file in "${files[@]}"; do
            uploaded=false
            for attempt in 1 2 3; do
              if timeout 60s gh release upload "$GITHUB_REF_NAME" "$file" \
                --repo "$GITHUB_REPOSITORY" --clobber; then
                uploaded=true
                break
              fi
              echo "Upload attempt ${attempt} failed for ${file}" >&2
            done
            test "$uploaded" = true
          done

          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest

  npm:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
      - name: Stage native packages
        run: |
          for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            node scripts/release.mjs stage "$platform" "artifacts/binary-$platform/astcount"
          done
      - name: Publish platform packages, then launcher
        shell: bash
        run: |
          publish_if_missing() {
            local directory="$1"
            local name version
            name="$(node -p "require('./${directory}/package.json').name")"
            version="$(node -p "require('./${directory}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published"
            else
              npm publish "./${directory}" --access public --provenance
            fi
          }

          for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            publish_if_missing "npm/platforms/$platform"
          done
          publish_if_missing npm/astcount
